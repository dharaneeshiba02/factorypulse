name: factorypulse

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factorypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-factorypulse}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init/01_timescale.sql:/docker-entrypoint-initdb.d/01_timescale.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  schema-migrate:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      PGHOST: timescaledb
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-factorypulse}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-factorypulse}
    volumes:
      - ./db/migrations/versions/0002_m2_schema_compatibility.sql:/migration/0002_m2_schema_compatibility.sql:ro
    command:
      ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /migration/0002_m2_schema_compatibility.sql"]
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: factorypulse/qdrant-dev:v1.12.1
    build:
      context: ./docker/qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:6333/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-h",
          "127.0.0.1",
          "-t",
          "factorypulse/healthcheck",
          "-V",
          "mqttv5",
          "-E",
          "-W",
          "5",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ingestion:
    image: factorypulse/ingestion:dev
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      INGEST_DATABASE_URL: postgresql://${POSTGRES_USER:-factorypulse}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-factorypulse}
      INGEST_REDIS_URL: redis://redis:6379/0
      INGEST_MQTT_BROKER: mosquitto
      INGEST_MQTT_PORT: 1883
      INGEST_MQTT_TOPIC: ${SIM_MQTT_TOPIC:-factorypulse/telemetry}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-500}
      INGEST_FLUSH_INTERVAL_SECONDS: ${INGEST_FLUSH_INTERVAL_SECONDS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    profiles: [demo]
    image: factorypulse/simulator:dev
    build:
      context: ./services/simulator
    environment:
      SIM_DATA_DIR: /app/data/processed
      SIM_REPLAY_RATE_HZ: ${SIM_REPLAY_RATE_HZ:-10}
      SIM_MACHINE_COUNT: ${SIM_MACHINE_COUNT:-1}
      SIM_TRANSPORT_TYPE: mqtt
      SIM_MQTT_BROKER: mosquitto
      SIM_MQTT_PORT: 1883
      SIM_MQTT_TOPIC: ${SIM_MQTT_TOPIC:-factorypulse/telemetry}
      SIM_INJECT_FAULTS: ${SIM_INJECT_FAULTS:-false}
      SIM_FAULT_PROBABILITY: ${SIM_FAULT_PROBABILITY:-0.05}
    volumes:
      - ./data/processed:/app/data/processed:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////mlflow/mlflow.db",
        "--default-artifact-root",
        "/mlflow/artifacts",
      ]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  timescaledb_data:
  redis_data:
  qdrant_data:
  mlflow_data:
  mosquitto_data:
