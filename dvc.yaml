stages:
  load_and_canonicalize:
    cmd: python ml/src/factorypulse_ml/data/loaders.py data/raw data/interim
    deps:
      - data/raw/train_FD001.txt
      - ml/src/factorypulse_ml/data/loaders.py
      - ml/src/factorypulse_ml/data/canonical.py
    outs:
      - data/interim/cmapss_canonical.parquet

  split:
    cmd: python ml/src/factorypulse_ml/data/splits.py data/interim data/processed
    deps:
      - data/interim/cmapss_canonical.parquet
      - ml/src/factorypulse_ml/data/splits.py
    params:
      - data.train_ratio
      - data.val_ratio
    outs:
      - data/processed/cmapss_train.parquet
      - data/processed/cmapss_val.parquet
      - data/processed/cmapss_test.parquet

  featurize:
    cmd: python ml/src/factorypulse_ml/features/pipeline.py data/processed data/featured
    deps:
      - data/processed/cmapss_train.parquet
      - data/processed/cmapss_val.parquet
      - data/processed/cmapss_test.parquet
      - ml/src/factorypulse_ml/features/
    outs:
      - data/featured/cmapss_featured_train.parquet
      - data/featured/cmapss_featured_val.parquet
      - data/featured/cmapss_featured_test.parquet

  train_rul:
    cmd: python ml/src/factorypulse_ml/training/train_rul.py data/featured
    deps:
      - data/featured/cmapss_featured_train.parquet
      - data/featured/cmapss_featured_val.parquet
      - ml/src/factorypulse_ml/models/rul_xgboost.py
      - ml/src/factorypulse_ml/models/rul_transformer.py
      - ml/src/factorypulse_ml/training/train_rul.py

  train_anomaly:
    cmd: python ml/src/factorypulse_ml/training/train_anomaly.py data/featured
    deps:
      - data/featured/cmapss_featured_train.parquet
      - data/featured/cmapss_featured_val.parquet
      - ml/src/factorypulse_ml/models/lstm_autoencoder.py
      - ml/src/factorypulse_ml/training/train_anomaly.py

  train_failure:
    cmd: python ml/src/factorypulse_ml/training/train_failure.py data/featured
    deps:
      - data/featured/cmapss_featured_train.parquet
      - data/featured/cmapss_featured_val.parquet
      - ml/src/factorypulse_ml/models/failure_lgbm.py
      - ml/src/factorypulse_ml/training/train_failure.py
