[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-console"
version = "0.1.0"
description = "FactoryPulse Streamlit operations console"
requires-python = ">=3.10,<3.11"
dependencies = [
    "streamlit==1.41.1",
    "requests==2.32.3",
    "plotly==5.24.1",
    "pandas==2.2.3",
    "pydantic-settings==2.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]
