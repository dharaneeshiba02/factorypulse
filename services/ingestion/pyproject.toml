[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-ingestion"
version = "0.1.0"
description = "Telemetry ingestion service for FactoryPulse"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "asyncpg==0.30.0",
    "paho-mqtt==1.6.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "redis==5.2.1",
    "orjson==3.10.12",
    "numpy==1.26.4",
    "pandas==2.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]
