[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-inference"
version = "0.1.0"
description = "FactoryPulse model inference and alerting API"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "mlflow==2.17.2",
    "numpy==1.26.4",
    "torch==2.5.1",
    "xgboost==2.1.3",
    "lightgbm==4.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
