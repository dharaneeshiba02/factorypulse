[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-simulator"
version = "0.1.0"
description = "Sensor simulator for FactoryPulse"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "paho-mqtt==1.6.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
