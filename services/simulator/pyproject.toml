[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-simulator"
version = "0.1.0"
description = "Sensor simulator for FactoryPulse"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "paho-mqtt>=1.6.1",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
